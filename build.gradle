	// jaxb 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    // jaxb 'com.sun.xml.bind:jaxb-impl:4.0.2'
    // jaxb 'com.sun.xml.bind:jaxb-core:4.0.2'
    // jaxb 'com.sun.xml.bind:jaxb-xjc:4.0.2'

	// jaxb 'org.glassfish.jaxb:jaxb-xjc:4.0.2'
    // jaxb 'org.glassfish.jaxb:jaxb-runtime:4.0.2'
    // jaxb 'org.jvnet.jaxb2_commons:jaxb2-basics-ant:1.11.1'
    // jaxb 'org.jvnet.jaxb2_commons:jaxb2-basics:1.11.1'
    // jaxb 'org.jvnet.jaxb2_commons:jaxb2-basics-tools:1.11.1'
	// jaxb 'org.jvnet.jaxb2_commons:jaxb2-annotate-plugin:1.1.0'
    // jaxb 'javax.validation:validation-api:2.0.1.Final'

	jaxb 'org.glassfish.jaxb:jaxb-xjc:4.0.2'
	jaxb 'org.glassfish.jaxb:jaxb-runtime:4.0.2'
}

task generateJaxb(type: JavaExec) {
        group = 'JAXB'
        description = 'Generates Java classes from WSDL using XJC'
   
        // Ensure the output directory exists
        doFirst {
            file("src/main/java/com/pmo/nid/soap/schemas").mkdirs()
        }
   
        // Set the classpath for the XJC tool
        classpath = configurations.jaxb
   
        // Set the main class to run
        main = 'com.sun.tools.xjc.Driver'
   
        // Set the arguments for the XJC tool
        args = [
            '-d', 'src/main/java',
            '-p', 'com.pmo.nid.soap.schemas',
            '-wsdl', 'src/main/resources/nid-wsdl.wsdl'
        ]
}

compileJava.dependsOn generateJaxb

tasks.named('test') {
	useJUnitPlatform()
}
